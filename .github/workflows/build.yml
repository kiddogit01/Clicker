name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Compiler l'APK (version debug, installable directement)
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Remonter l'erreur de compilation
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('build.log')
          log = p.read_text(errors='replace') if p.exists() else 'build.log introuvable'
          lines = log.splitlines()
          # 1) section "What went wrong" de Gradle
          idx = next((i for i, l in enumerate(lines) if 'What went wrong' in l), None)
          chunks = []
          if idx is not None:
              chunks.append('\n'.join(lines[idx:idx + 40]))
          # 2) premières erreurs Kotlin / AAPT / task
          pat = re.compile(r'(^e: |error:|FAILURE:|Execution failed for task|Caused by:|AAPT)')
          errs = [l.strip() for l in lines if pat.search(l)][:15]
          if errs:
              chunks.append('\n'.join(errs))
          # 3) dernier recours : fin du log
          if not chunks:
              chunks.append('\n'.join(lines[-40:]))
          chunk = chunks[0] + ('\n---\n' + chunks[1] if len(chunks) > 1 and chunks[1] else '')
          chunk = chunk.replace('\r', '')[:4000]
          msg = chunk.replace('\n', '%0A').replace('::', '⁚')
          print(f'::error title=Compilation échouée::{msg}')
          PY
          {
            echo '## ❌ Log de compilation'
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo 'build.log introuvable'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: KidCliker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK (commit branche + release de téléchargement)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KidCliker-debug.apk
          # 1) Commit sur la branche en cours (jamais sur main : pas de boucle)
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release/KidCliker-debug.apk
            git commit -m "APK: build ${{ github.sha }}" || true
            git push origin "HEAD:${{ github.ref }}"
          fi
          # 2) Release roulante → lien de téléchargement stable pour le téléphone
          gh release view latest-apk >/dev/null 2>&1 || \
            gh release create latest-apk \
              --title "KidCliker — APK de test" \
              --notes "Build de test automatisé. Installe sur ton Android (autoriser les sources inconnues)."
          gh release upload latest-apk release/KidCliker-debug.apk --clobber
