name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Compiler l'APK (version debug, installable directement)
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Afficher le log en cas d'erreur
        if: failure()
        run: |
          {
            echo '## ❌ Log de compilation (taille limitée)'
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo 'build.log introuvable'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: KidCliker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
